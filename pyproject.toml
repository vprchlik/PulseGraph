[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsegraph"
version = "0.2.0"
description = "A redesigned empirical study of probabilistic forecasts for daily GitHub star counts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

# Development requirements, not a frozen experiment environment. Record exact
# package versions and model revision hashes before the registered evaluation.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "lightgbm>=4.2",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Keep model runtimes separate from the data, baseline and test environment.
models = [
    "torch>=2.2",
    "huggingface-hub>=0.23",
    "chronos-forecasting>=2.0",
    "timesfm[torch]>=2.0.2",
]
dev = [
    "pytest>=8.0",
    "build>=1.2",
    "ruff>=0.3",
]

[project.urls]
Repository = "https://github.com/vprchlik/PulseGraph"

[tool.setuptools.packages.find]
where = ["."]
include = ["pulsegraph", "pulsegraph.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "v1_reference", "build", "dist", "data", "models"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["v1_reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
